[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nicis-toolbox"
version = "0.1.0"
description = "A curated collection of handy Python utilities, tools, and helpers."
readme = "README.md"
authors = [
    { name = "Nici (Ghost3379)", url = "https://github.com/Ghost3379" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/Ghost3379/nicis-toolbox"
Repository = "https://github.com/Ghost3379/nicis-toolbox"

[tool.setuptools.packages.find]
where = ["."]
include = ["nicis_toolbox*"]
